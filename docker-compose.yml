# Caddy (HTTPS) + API + panel web. La base de datos es externa: define DATABASE_URL en apps/api/.env.
# DOMAIN (API) y WEB_DOMAIN (panel) se interpolan desde el .env de la raíz
# (o usa `docker compose --env-file apps/api/.env up`).
services:
  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: apps/api/.env
    environment:
      PORT: "3005"
      # Un único proxy (Caddy) delante de la app: necesario para que el rate limiting vea la IP real.
      TRUST_PROXY: "1"
    # Sin `ports`: la app solo es accesible a través de Caddy, dentro de la red de compose.
    expose:
      - "3005"

  caddy:
    # Imagen de Caddy con el build del panel en /srv/web (apps/web/Dockerfile).
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # El panel llama a la API en su mismo dominio (/api, ver Caddyfile).
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en el .env}
      WEB_DOMAIN: ${WEB_DOMAIN:?Define WEB_DOMAIN en el .env (dominio del panel web)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
